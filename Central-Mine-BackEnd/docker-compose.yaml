services:
  api:
    container_name: central-mine-api
    image: central-mine:1.0.0
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./.env.production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      - postgres
    extra_hosts:
      - ${INTERNAL_HOST:-INTERNAL_HOST}:host-gateway

  postgres:
    image: postgis/postgis:16-3.4
    container_name: central-mine-postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.db.production
    # Do NOT publish this to the host — api reaches it over the compose
    # network at postgres:5432. Publishing it exposes postgres to the
    # whole internet and it will get hammered by credential-stuffing bots.

volumes:
  postgres_data:
  api_uploads:
